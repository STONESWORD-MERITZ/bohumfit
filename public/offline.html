<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#084734" />
    <title>오프라인 · 보험핏</title>
    <!-- BOHUMFIT-264: 서비스워커 오프라인 폴백. 외부 자산 의존 0(네트워크가 없을 때 뜨는 화면). -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px calc(20px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));
        background: #f7faf8;
        color: #0a0a0a;
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
        line-height: 1.6;
        word-break: keep-all;
      }
      .card { width: 100%; max-width: 380px; text-align: center; }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 20px;
        display: flex; align-items: center; justify-content: center;
        background: #084734; color: #fff;
        border-radius: 14px; font-size: 28px; font-weight: 800;
      }
      h1 { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
      p { font-size: 16px; color: #475569; margin-bottom: 6px; }
      .hint { font-size: 13px; color: #7c8b85; margin-top: 14px; }
      button {
        margin-top: 22px; width: 100%; min-height: 48px;
        border: 0; border-radius: 10px;
        background: #084734; color: #fff;
        font-size: 16px; font-weight: 700; cursor: pointer;
      }
      button:active { background: #063527; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1512; color: #eef2f0; }
        p { color: #cbd5d1; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">ㅍ</div>
      <h1>인터넷 연결이 끊겼어요</h1>
      <p>네트워크가 복구되면 이어서 사용할 수 있습니다.</p>
      <p class="hint">분석·업로드는 연결이 필요합니다. Wi-Fi 또는 데이터 연결을 확인해 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
    <script>
      // 연결이 돌아오면 자동으로 되돌아간다.
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
